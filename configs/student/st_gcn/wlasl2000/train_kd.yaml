work_dir: ./work_dir/recognition/wlasl2000/ST_GCN_KD

# feeder (team StudentDataset)
feeder: src.student_model.feeder.student_dataset.StudentDataset
train_feeder_args:
  split_json: ./data/WLASL2000/preprocess/nslt_2000.json
  skeleton_dir: ./processed/skeletons
  logits_dir: ./processed/logits
  subset: train
  seq_len: 64
test_feeder_args:
  split_json: ./data/WLASL2000/preprocess/nslt_2000.json
  skeleton_dir: ./processed/skeletons
  logits_dir: ./processed/logits
  subset: test
  seq_len: 64

# model
model: src.student_model.architecture.st_gcn.Model
model_args:
  in_channels: 3
  num_class: 2000
  dropout: 0.5
  edge_importance_weighting: True
  graph_args:
    layout: 'openpose'
    strategy: 'spatial'

# kd
kd_alpha: 0.5
kd_temperature: 4.0

# optim
weight_decay: 0.0001
base_lr: 0.1
step: [20, 40, 60]

# training
device: [0]
batch_size: 32
test_batch_size: 32
num_epoch: 80
num_worker: 4
