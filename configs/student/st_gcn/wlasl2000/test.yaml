weights: ./work_dir/recognition/wlasl2000/ST_GCN/epoch80_model.pt

# feeder
feeder: feeder.feeder.Feeder
test_feeder_args:
  data_path: ./data/WLASL/wlasl2000/val_data.npy
  label_path: ./data/WLASL/wlasl2000/val_label.pkl

# model
model: src.student_model.architecture.st_gcn.Model
model_args:
  in_channels: 3
  num_class: 2000
  dropout: 0.5
  edge_importance_weighting: True
  graph_args:
    layout: 'openpose'
    strategy: 'spatial'

# test
phase: test
device: 0
test_batch_size: 32
